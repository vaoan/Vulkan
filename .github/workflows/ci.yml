# themis-ci
# This body's CI. It only calls Themis's reusable body CI; check names appear as `ci / <job>`.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop, main]

jobs:
  ci:
    permissions: { contents: read, pull-requests: read, issues: read }
    uses: vaoan/Themis/.github/workflows/body-ci.yml@main
    with:
      # false until this repository has Supabase; the database task turns it to true.
      database: false
